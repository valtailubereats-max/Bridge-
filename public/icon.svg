<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="warn-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>
  
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  
  <!-- Red Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#warn-grad)" stroke-width="16" opacity="0.8" />
  
  <!-- Warning Triangle Symbol -->
  <path d="M256 64 L448 396 A24 24 0 0 1 428 432 L84 432 A24 24 0 0 1 64 396 Z" fill="#eab308" />
  
  <!-- Outer border of triangle -->
  <path d="M256 64 L448 396 A24 24 0 0 1 428 432 L84 432 A24 24 0 0 1 64 396 Z" fill="none" stroke="#000000" stroke-width="24" stroke-linejoin="round" />
  
  <!-- Inner details of triangle: bridge clearance symbol -->
  <!-- Flat top bridge bar -->
  <path d="M150 180 L362 180" stroke="#000000" stroke-width="18" stroke-linecap="round" />
  <path d="M150 180 L150 210" stroke="#000000" stroke-width="14" stroke-linecap="round" />
  <path d="M362 180 L362 210" stroke="#000000" stroke-width="14" stroke-linecap="round" />
  
  <!-- Arrow top pointing down -->
  <path d="M256 220 L256 310" stroke="#000000" stroke-width="14" stroke-linecap="round" />
  <path d="M226 250 L256 220 L286 250" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Arrow bottom pointing up -->
  <path d="M226 280 L256 310 L286 280" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Text inside triangle - e.g., Height "3.8m" or warning -->
  <text x="256" y="380" font-family="'Inter', sans-serif, system-ui" font-weight="900" font-size="54" fill="#000000" text-anchor="middle">3.8m</text>
</svg>
